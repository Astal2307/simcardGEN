<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E0F12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIMRUSH">
<title>SIMRUSH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Onest:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap">
<style>
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#08090B;overscroll-behavior:none}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;margin:0;font-size:inherit}
button:disabled{cursor:default}

.app{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;overflow:hidden;background:#0E0F12;color:#ECEDEF;font-family:'Onest',system-ui,-apple-system,sans-serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.disp{font-family:'Unbounded','Arial Black',system-ui,sans-serif}
.tnum{font-variant-numeric:tabular-nums}

.hdr{position:absolute;top:0;left:0;right:0;height:calc(64px + var(--st));padding:var(--st) 16px 0;display:flex;align-items:center;justify-content:space-between;z-index:5;background:#0E0F12}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:.02em}
.bal{display:flex;align-items:center;height:44px;border-radius:22px;background:#17191E;border:1px solid #23262D;padding-left:14px;gap:6px}
.bal-v{font-weight:600;font-size:15px;white-space:nowrap}
.ib{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;flex:none;transition:background .15s}
.ib:active{background:#23262D}

.scr{position:absolute;top:calc(64px + var(--st));bottom:calc(76px + var(--sb));left:0;right:0;overflow-y:auto;overflow-x:hidden;padding:4px 16px 20px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scr::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.col{display:flex;flex-direction:column}

.nav{position:absolute;bottom:0;left:0;right:0;height:calc(76px + var(--sb));padding:0 8px calc(8px + var(--sb));border-top:1px solid #1E2127;background:#0E0F12;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));z-index:5}
.nb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#7D828B;font-size:11px;font-weight:500;transition:color .2s}
.nb.on{color:#ECEDEF}
.nb.on::before{content:'';position:absolute;top:-1px;left:50%;width:24px;margin-left:-12px;height:2px;border-radius:2px;background:#ECEDEF}

/* rarity */
.c-common{color:#9AA0A8}.c-uncommon{color:#5BC98A}.c-rare{color:#4C8DFF}.c-epic{color:#A66BFF}.c-legendary{color:#F5B83D}
.bg-common{background:#9AA0A8}.bg-uncommon{background:#5BC98A}.bg-rare{background:#4C8DFF}.bg-epic{background:#A66BFF}.bg-legendary{background:#F5B83D}
.t-common{background:rgba(154,160,168,.12);color:#AEB3BA}.t-uncommon{background:rgba(91,201,138,.12);color:#5BC98A}.t-rare{background:rgba(76,141,255,.14);color:#6FA3FF}.t-epic{background:rgba(166,107,255,.15);color:#B78AFF}.t-legendary{background:rgba(245,184,61,.14);color:#F5B83D}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.tag{font-size:11px;font-weight:600;padding:4px 8px;border-radius:8px;white-space:nowrap;flex:none}

/* stage */
.stage{height:340px;border-radius:24px;background-color:#121419;background-image:radial-gradient(#1F2229 1px,transparent 1px);background-size:14px 14px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.scaler{position:absolute;left:0;top:0;width:326px;height:206px;transform-origin:0 0}
.cw{position:absolute;inset:0}
.co{position:absolute;inset:0;border-radius:18px;clip-path:polygon(0 0,calc(100% - 36px) 0,100% 36px,100% 100%,0 100%);background:#2A2D35;transition:background .35s}
.ci{position:absolute;inset:1.5px;border-radius:16.5px;clip-path:polygon(0 0,calc(100% - 35.4px) 0,100% 35.4px,100% 100%,0 100%);background:#16181D;overflow:hidden;padding:22px 20px;display:flex;flex-direction:column;justify-content:space-between}
.chip{width:46px;height:36px;border-radius:7px;flex:none;background-color:#6E727B;background-image:linear-gradient(#4E525A,#4E525A),linear-gradient(#4E525A,#4E525A),linear-gradient(#4E525A,#4E525A);background-size:100% 1.5px,100% 1.5px,1.5px 100%;background-position:0 11px,0 23px,22px 0;background-repeat:no-repeat}
.b-spin{background:#3A3E47}
.b-common{background:#454952}.b-uncommon{background:#5BC98A}.b-rare{background:#4C8DFF}.b-epic{background:#A66BFF}.b-legendary{background:#F5B83D}

.cw.spin{animation:hum .5s ease-in-out infinite}
.fx-uncommon{animation:p1 .4s ease-out}
.fx-rare{animation:p2 .45s ease-out}
.fx-epic{animation:p3 .6s ease-out}
.fx-legendary{animation:shake .75s ease-out}
@keyframes hum{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes p1{40%{transform:scale(1.025)}}
@keyframes p2{35%{transform:scale(1.04)}}
@keyframes p3{30%{transform:scale(1.06) rotate(-.6deg)}60%{transform:scale(.99)}}
@keyframes shake{10%{transform:translateX(-4px) rotate(-.8deg)}20%{transform:translateX(4px) rotate(.8deg)}30%{transform:translateX(-3px)}42%{transform:scale(1.07)}70%{transform:scale(.99)}100%{transform:none}}

.num{display:flex;align-items:center;font-weight:600;font-size:24px;line-height:1;color:#ECEDEF}
.pfx{color:#7D828B;margin-right:8px;flex:none}
.sep{width:17px;text-align:center;color:#7D828B;flex:none}
.gp{width:8px;flex:none}
.dg{width:17px;height:34px;display:flex;align-items:center;justify-content:center;flex:none}
.dg-in{display:block}
.d-idle{color:#3A3E46}
.d-roll{overflow:hidden;color:#8A8F98}
.d-roll .dg-in{animation:roll .11s linear infinite}
.d-lock{transition:color .35s}
.d-lock .dg-in{animation:lock .45s cubic-bezier(.2,1.6,.4,1)}
.r-uncommon .d-lock{color:#5BC98A}.r-rare .d-lock{color:#6FA3FF}.r-epic .d-lock{color:#B78AFF}
.r-legendary .d-lock{color:#F5B83D;text-shadow:0 0 12px rgba(245,184,61,.5)}
@keyframes roll{0%{transform:translateY(-60%);opacity:.25}50%{opacity:1}100%{transform:translateY(60%);opacity:.25}}
@keyframes lock{0%{transform:translateY(-70%) scale(1.25);opacity:0;filter:blur(3px)}100%{transform:none;opacity:1;filter:none}}

.ring{position:absolute;inset:0;border-radius:20px;border:2px solid;opacity:0;pointer-events:none;animation:ring 1.1s cubic-bezier(.2,.7,.3,1) both}
.ring-uncommon{border-color:#5BC98A}.ring-rare{border-color:#4C8DFF}.ring-epic{border-color:#A66BFF}.ring-legendary{border-color:#F5B83D}
@keyframes ring{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.22);opacity:0}}
.pts{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.pw{position:absolute;left:0;top:0;width:0;height:0}
.pt{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:2px;opacity:0}
.fa{animation:fa .85s cubic-bezier(.15,.7,.3,1) both}
.fb{animation:fb .95s cubic-bezier(.15,.7,.3,1) both}
.fc{animation:fc 1.05s cubic-bezier(.15,.7,.3,1) both}
@keyframes fa{0%{transform:translateY(0) scale(1.2);opacity:1}100%{transform:translateY(-105px) scale(.3);opacity:0}}
@keyframes fb{0%{transform:translateY(0) scale(1.2);opacity:1}100%{transform:translateY(-140px) scale(.3);opacity:0}}
@keyframes fc{0%{transform:translateY(0) scale(1.2);opacity:1}100%{transform:translateY(-175px) scale(.3);opacity:0}}
.sw{position:absolute;top:-30%;bottom:-30%;width:70px;left:-40%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.16),rgba(255,255,255,0));transform:skewX(-18deg);animation:sweep 1s .15s ease-out both;pointer-events:none}
@keyframes sweep{from{left:-40%}to{left:130%}}

.rinfo{height:54px;display:flex;flex-direction:column;align-items:center;gap:6px}
.rl{font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.rv{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:600}
.up{animation:up .45s cubic-bezier(.2,.8,.3,1) both}
.up2{animation:up .45s .12s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.spin-btn{margin-top:16px;width:100%;height:60px;border-radius:18px;background:#ECEDEF;color:#0E0F12;display:flex;align-items:center;justify-content:space-between;padding:0 22px;transition:transform .12s,opacity .2s}
.spin-btn:active:not(:disabled){transform:scale(.98)}
.spin-btn:disabled{opacity:.45}
.grid5{margin-top:12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pill{height:34px;border-radius:10px;background:#15171B;border:1px solid #1E2127;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;color:#C5C8CE;white-space:nowrap;overflow:hidden}
.lbl{font-size:12px;color:#7D828B;font-weight:500}

.card{background:#15171B;border:1px solid #1E2127;border-radius:16px}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat-v{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:0 16px;scrollbar-width:none}
.chip-f{flex:none;height:40px;padding:0 14px;border-radius:20px;border:1px solid #23262D;font-size:13px;font-weight:500;color:#AEB2B9;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.chip-f.on{background:#ECEDEF;color:#0E0F12;border-color:#ECEDEF}
.list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.row{width:100%;height:66px;border-radius:16px;background:#15171B;border:1px solid #1E2127;display:flex;align-items:center;gap:12px;padding:0 16px;text-align:left;transition:background .15s}
.row:active{background:#1A1C21}
.rb{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600;white-space:nowrap;flex:none}
.empty{padding:48px 0;text-align:center;color:#7D828B;font-size:14px}

.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));height:44px;padding:4px;border-radius:14px;background:#15171B;border:1px solid #1E2127}
.sg{border-radius:10px;font-size:14px;font-weight:600;color:#7D828B;transition:background .2s,color .2s}
.sg.on{background:#262930;color:#ECEDEF}

.lot{background:#15171B;border:1px solid #1E2127;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.lr{display:flex;align-items:center;justify-content:space-between;gap:8px 10px}
.lr.wrap{flex-wrap:wrap}
.lr.end{align-items:flex-end}
.ln{font-size:17px;font-weight:600;white-space:nowrap}
.meta{font-size:13px;color:#8A8F98}
.av-s{width:22px;height:22px;border-radius:50%;background:#23262D;color:#C5C8CE;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none}
.timer{display:flex;align-items:center;gap:5px;flex:none}
.urg{color:#FF9A5C}
.bidv{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:600;white-space:nowrap}
.bb{height:44px;padding:0 16px;border-radius:12px;background:#ECEDEF;color:#0E0F12;font-size:14px;font-weight:600;white-space:nowrap;flex:none;transition:opacity .2s,transform .12s}
.bb:active:not(:disabled){transform:scale(.97)}
.bb:disabled{opacity:.4}
.bb.ghost{background:transparent;color:#ECEDEF;border:1px solid #2E323A}
.bb.ghost:disabled{opacity:1}

.hero{padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:20px}
.rk{height:60px;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:14px;border:1px solid transparent}
.rk.me{background:#1B1E24;border-color:#2E323A}
.rk-n{width:26px;text-align:center;font-size:13px;font-weight:600;color:#7D828B;flex:none}
.rk-n.top{color:#ECEDEF}
.av{width:36px;height:36px;border-radius:50%;background:#23262D;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:#C5C8CE;flex:none}

.ov{position:absolute;inset:0;width:100%;height:100%;background:rgba(5,6,8,.62);z-index:20;animation:fade .2s both}
.sh{position:absolute;left:0;right:0;bottom:0;z-index:21;background:#15171B;border-top:1px solid #23262D;border-radius:24px 24px 0 0;padding:10px 20px calc(28px + var(--sb));display:flex;flex-direction:column;gap:18px;animation:slide .32s cubic-bezier(.2,.9,.3,1) both}
.grab{width:36px;height:4px;border-radius:2px;background:#2E323A;align-self:center}
.stepper{display:flex;align-items:center;gap:4px;background:#0E0F12;border:1px solid #23262D;border-radius:14px;padding:2px}
.btn1{height:56px;border-radius:16px;background:#ECEDEF;color:#0E0F12;font-size:15px;font-weight:600}
.btn2{height:52px;border-radius:14px;border:1px solid #2E323A;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:15px;font-weight:600}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}

.toast{position:absolute;top:calc(68px + var(--st));left:16px;right:16px;z-index:30;height:48px;border-radius:14px;background:#1E2127;border:1px solid #2A2D35;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:14px;font-weight:500;animation:toast 2.5s both;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translateY(-12px)}10%,84%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}

@media (hover:hover){
  .row:hover{background:#1A1C21}
  .ib:hover{background:#23262D}
}
</style>
</head>

function pickRarity(w) {
  const total = RAR.reduce((a, k) => a + w[k], 0);
  let x = Math.random() * total, acc = 0;
  for (const k of RAR) { acc += w[k]; if (x < acc) return k; }
  return 'common';
}
function genDigits(r) {
  const code = [9, ri(10), ri(10)]; let t, d, a, b, s;
  if (r === 'legendary') { d = ri(10); t = seq(() => d); if (Math.random() < 0.4) { code[1] = d; code[2] = d; } }
  else if (r === 'epic') {
    const m = ri(3);
    if (m === 0) { s = ri(4); t = seq(i => s + i); }
    else if (m === 1) { s = 6 + ri(4); t = seq(i => s - i); }
    else { d = ri(10); t = [ri(10), d, d, d, d, d, d]; }
  } else if (r === 'rare') {
    if (Math.random() < 0.5) { d = ri(10); t = [ri(10), ri(10), ri(10), d, d, d, d]; }
    else { a = ri(10); b = (a + 1 + ri(9)) % 10; t = [ri(10), a, b, a, b, a, b]; }
  } else if (r === 'uncommon') {
    if (Math.random() < 0.5) { d = ri(10); t = [ri(10), ri(10), ri(10), ri(10), d, d, d]; }
    else { a = ri(10); b = (a + 1 + ri(9)) % 10; t = [ri(10), ri(10), ri(10), a, b, b, a]; }
  } else {
    t = seq(() => ri(10));
    if (t[4] === t[5] && t[5] === t[6]) t[6] = (t[6] + 1) % 10;
    if (t[3] === t[6] && t[4] === t[5]) t[5] = (t[5] + 3) % 10;
  }
  return code.concat(t);
}

    this.civ = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      this.setState({ countVal: Math.round(p.value * e) });
      if (k >= 1) clearInterval(this.civ);
    }, 30);
  }
  bid(id) {
    const s = this.state; let bal = s.balance;
    const lots = s.lots.map(l => {
      if (l.id !== id || l.leader === 'me') return l;
      const need = l.bid + l.step;
      if (bal < need) return l;
      bal -= need;
      return { ...l, bid: need, leader: 'me', bids: l.bids + 1, ends: l.ends < 6 ? l.ends + 6 : l.ends };
    });
    this.setState({ lots, balance: bal });
  }
  pull(id) {
    const s = this.state, l = s.myLots.find(x => x.id === id);
    if (!l || l.bids > 0) return;
    this.setState({ myLots: s.myLots.filter(x => x.id !== id), coll: [simOf(l)].concat(s.coll) });
  }
  selItem() { return this.state.coll.find(x => x.id === this.state.sheet); }
  sell() {
    const it = this.selItem(); if (!it) return;
    const gain = r10(it.value * 0.7);
    this.setState({ balance: this.state.balance + gain, coll: this.state.coll.filter(x => x.id !== it.id), sheet: null });
    this.toast('+' + fmt(gain), '#5BC98A');
  }
  listLot() {
    const it = this.selItem(); if (!it) return;
    const lot = { ...simOf(it), bid: this.state.listPrice, step: stepFor(it.value), ends: 25, bids: 0 };
    this.setState({ coll: this.state.coll.filter(x => x.id !== it.id), myLots: [lot].concat(this.state.myLots), sheet: null });
    this.toast('Выставлено · ' + shortNum(it.digits), RD[it.rarity].color);
  }
  bump(dir) {
    const it = this.selItem(); if (!it) return;
    const st = stepFor(it.value);
    this.setState({ listPrice: Math.max(st, this.state.listPrice + dir * st) });
  }
  go(tab) { this.setState({ tab, sheet: null }); if (this.scr) this.scr.scrollTop = 0; }

  chips(key, cur) {
    return html`<div class="chips">
      ${[{ k: 'all', label: 'Все' }, ...RAR.map(r => ({ k: r, label: RD[r].name }))].map(c => html`
        <button class=${'chip-f' + (cur === c.k ? ' on' : '')} onClick=${() => this.setState({ [key]: c.k })}>
          ${c.k !== 'all' && html`<span class=${'dot bg-' + c.k}></span>`}
          <span>${c.label}</span>
        </button>`)}
    </div>`;
  }

  spinScreen() {
    const s = this.state, res = s.result, fx = !!(s.showFx && res), rk = res ? res.rarity : 'common';
    const digits = [];
    for (let i = 0; i < 10; i++) {
      let ch, cls;
      if (s.spinning) { const lk = i < s.locked; ch = lk ? this.pending.digits[i] : s.roll[i]; cls = lk ? 'd-lock' : 'd-roll'; }
      else if (res) { ch = res.digits[i]; cls = 'd-lock'; }
      else { ch = i === 0 ? 9 : 0; cls = 'd-idle'; }
      digits.push(html`<span class=${'dg ' + cls}><span class="dg-in">${ch}</span></span>`);
      if (i === 2) digits.push(html`<span class="gp"></span>`);
      if (i === 5 || i === 7) digits.push(html`<span class="sep">-</span>`);
    }
    const ringN = { common: 0, uncommon: 1, rare: 2, epic: 2, legendary: 3 }[rk];
    const fit = s.fit;
    return html`<div class="col">
      <div class="stage">
        <div style=${`position:relative;flex:none;width:${326 * fit}px;height:${206 * fit}px`}>
          <div class="scaler" style=${`transform:scale(${fit})`}>
            <div class=${'cw' + (s.spinning ? ' spin' : '') + (fx ? ' fx-' + rk : '')} key=${'cw' + s.fxKey}>
              ${fx && [0, 180, 360].slice(0, ringN).map(d => html`<div class=${'ring ring-' + rk} style=${`animation-delay:${d}ms`}></div>`)}
              <div class=${'co ' + (fx ? 'b-' + rk : s.spinning ? 'b-spin' : '')}>
                <div class="ci">
                  ${fx && (rk === 'epic' || rk === 'legendary') && html`<div class="sw"></div>`}
                  <div class="chip"></div>
                  <div class=${'num mono ' + (fx ? 'r-' + rk : '')}>
                    <span class="pfx">+7</span>${digits}
                  </div>
                </div>
              </div>
              ${fx && html`<div class="pts">${s.particles.map(p => html`
                <div class="pw" style=${`transform:rotate(${p.a}deg)`}>
                  <div class=${'pt ' + p.cls} style=${`animation-delay:${p.delay}ms;background:${p.color}`}></div>
                </div>`)}</div>`}
            </div>
          </div>
        </div>
        <div class="rinfo">
          ${fx && html`
            <div class=${'disp rl up c-' + rk}>${RD[rk].name}</div>
            <div class="rv up2 tnum"><${Coin}/><span>${fmt(s.countVal)}</span></div>`}
        </div>
      </div>

      <button class="spin-btn" onClick=${() => this.spin()} disabled=${s.spinning || s.balance < COST}>
        <span class="disp" style="font-weight:600;font-size:15px">Крутить</span>
        <span style="display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600"><${Coin} c="#0E0F12"/><span>${fmt(COST)}</span></span>
      </button>

      <div class="grid5">
        ${RAR.map(r => html`<div class="pill tnum"><span class=${'dot bg-' + r}></span><span>${String(RD[r].p).replace('.', ',')}%</span></div>`)}
      </div>

      ${s.recent.length > 0 && html`<div class="col" style="margin-top:20px;gap:8px">
        <div class="lbl">Последние</div>
        <div class="grid4">
          ${s.recent.map(x => html`<div class="pill up" key=${x.id} style="height:36px"><span class=${'dot bg-' + x.rarity}></span><span class="mono" style="font-size:12.5px;font-weight:500;color:#ECEDEF">${shortNum(x.digits)}</span></div>`)}
        </div>
      </div>`}
    </div>`;
  }

  collScreen() {
    const s = this.state;
    const items = s.coll.filter(x => s.collFilter === 'all' || x.rarity === s.collFilter);
    const total = s.coll.reduce((a, x) => a + x.value, 0);
    return html`<div class="col">
      <div class="grid2">
        <div class="card stat"><div class="lbl">Номеров</div><div class="disp stat-v">${s.coll.length}</div></div>
        <div class="card stat"><div class="lbl">Стоимость</div><div class="disp stat-v">${fmt(total)}</div></div>
      </div>
      ${this.chips('collFilter', s.collFilter)}
      <div class="list">
        ${items.map(x => html`
          <button class="row" key=${x.id} onClick=${() => this.setState({ sheet: x.id, listPrice: r10(x.value * 0.9) })}>
            <span class=${'rb t-' + x.rarity}><${Sim}/></span>
            <span class="grow">
              <span class="mono ell" style="font-size:16px;font-weight:600">${phone(x.digits)}</span>
              <span class=${'c-' + x.rarity} style="font-size:12px;font-weight:500">${RD[x.rarity].name}</span>
            </span>
            <span class="val tnum"><${Coin} s=${14}/><span>${fmt(x.value)}</span></span>
          </button>`)}
        ${items.length === 0 && html`<div class="empty">Пусто</div>`}
      </div>
    </div>`;
  }

  aucScreen() {
    const s = this.state;
    const lots = s.lots.filter(l => s.aucFilter === 'all' || l.rarity === s.aucFilter).slice().sort((a, b) => a.ends - b.ends);
    return html`<div class="col">
      <div class="seg">
        <button class=${'sg' + (s.aucSeg === 'all' ? ' on' : '')} onClick=${() => this.setState({ aucSeg: 'all' })}>Лоты</button>
        <button class=${'sg' + (s.aucSeg === 'mine' ? ' on' : '')} onClick=${() => this.setState({ aucSeg: 'mine' })}>Мои · ${s.myLots.length}</button>
      </div>
      ${s.aucSeg === 'all' ? html`
        ${this.chips('aucFilter', s.aucFilter)}
        <div class="list" style="gap:10px">
          ${lots.map(l => {
            const mine = l.leader === 'me';
            return html`<div class="lot" key=${l.id}>
              <div class="lr wrap">
                <span class="mono ln">${phone(l.digits)}</span>
                <span class=${'tag t-' + l.rarity}>${RD[l.rarity].name}</span>
              </div>
              <div class="lr meta">
                <span style="display:flex;align-items:center;gap:8px;min-width:0">
                  <span class="av-s">${l.seller.charAt(0).toUpperCase()}</span>
                  <span class="ell">${l.seller}</span>
                </span>
                <span class=${'mono timer' + (l.ends <= 10 ? ' urg' : '')}><${Clock}/><span>${mmss(Math.max(0, l.ends))}</span></span>
              </div>
              <div class="lr end">
                <div class="col" style="gap:3px;min-width:0">
                  <span style="font-size:11px;color:#7D828B">Ставка · ${l.bids}</span>
                  <span class="bidv tnum"><${Coin} s=${15}/><span>${fmt(l.bid)}</span></span>
                </div>
                ${mine
                  ? html`<button class="bb ghost" disabled>Вы лидер</button>`
                  : html`<button class="bb" onClick=${() => this.bid(l.id)} disabled=${s.balance < l.bid + l.step}>+ ${fmt(l.step)}</button>`}
              </div>
            </div>`;
          })}
          ${lots.length === 0 && html`<div class="empty">Нет лотов</div>`}
        </div>` : html`
        <div class="list" style="gap:10px">
          ${s.myLots.map(l => html`<div class="lot" key=${l.id}>
            <div class="lr">
              <span class="mono ln ell" style="min-width:0">${phone(l.digits)}</span>
              <span class=${'mono timer meta' + (l.ends <= 10 ? ' urg' : '')}><${Clock}/><span>${mmss(Math.max(0, l.ends))}</span></span>
            </div>
            <div class="lr end">
              <div class="col" style="gap:3px;min-width:0">
                <span style="font-size:11px;color:#7D828B">Ставка · ${l.bids}</span>
                <span class="bidv tnum"><${Coin} s=${15}/><span>${fmt(l.bid)}</span></span>
              </div>
              ${l.bids === 0
                ? html`<button class="bb ghost" onClick=${() => this.pull(l.id)}>Снять</button>`
                : html`<span class=${'tag t-' + l.rarity}>${RD[l.rarity].name}</span>`}
            </div>
          </div>`)}
          ${s.myLots.length === 0 && html`<div class="empty">Пусто</div>`}
        </div>`}
    </div>`;
  }

  rateScreen() {
    const s = this.state, byVal = s.rateSeg === 'value';
    const total = s.coll.reduce((a, x) => a + x.value, 0);
    let best = 'common';
    s.coll.forEach(x => { if (RAR.indexOf(x.rarity) > RAR.indexOf(best)) best = x.rarity; });
    const me = { name: 'Вы', value: total, count: s.coll.length, best, me: true };
    const board = [...PLAYERS, me].sort((a, b) => byVal ? b.value - a.value : b.count - a.count);
    const myRank = board.indexOf(me) + 1;
    return html`<div class="col">
      <div class="card hero">
        <div class="col" style="gap:4px">
          <span class="lbl">Место</span>
          <span class="disp" style="font-size:30px;font-weight:600;line-height:1.1">#${myRank}</span>
        </div>
        <div class="col" style="gap:4px;align-items:flex-end;min-width:0">
          <span class="lbl">${byVal ? 'Стоимость' : 'Номеров'}</span>
          <span class="tnum" style="font-size:18px;font-weight:600;white-space:nowrap">${byVal ? fmt(total) : s.coll.length}</span>
        </div>
      </div>
      <div class="seg" style="margin-top:12px">
        <button class=${'sg' + (byVal ? ' on' : '')} onClick=${() => this.setState({ rateSeg: 'value' })}>Стоимость</button>
        <button class=${'sg' + (!byVal ? ' on' : '')} onClick=${() => this.setState({ rateSeg: 'count' })}>Номера</button>
      </div>
      <div class="col" style="margin-top:10px;gap:4px">
        ${board.map((p, i) => html`<div class=${'rk' + (p.me ? ' me' : '')} key=${p.name}>
          <span class=${'disp rk-n' + (i < 3 ? ' top' : '')}>${i + 1}</span>
          <span class="av">${p.name.charAt(0).toUpperCase()}</span>
          <span style="flex:1;min-width:0;display:flex;align-items:center;gap:8px">
            <span class="ell" style="font-size:15px;font-weight:600">${p.name}</span>
            <span class=${'dot bg-' + p.best}></span>
          </span>
          <span class="tnum" style="font-size:14px;font-weight:600;white-space:nowrap;flex:none">${byVal ? fmt(p.value) : p.count + ' шт'}</span>
        </div>`)}
      </div>
    </div>`;
  }

  sheet() {
    const it = this.selItem();
    if (!it) return null;
    return html`
      <button class="ov" aria-label="Закрыть" onClick=${() => this.setState({ sheet: null })}></button>
      <div class="sh">
        <div class="grab"></div>
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
          <div class="col" style="gap:8px;min-width:0">
            <span class="mono ell" style="font-size:22px;font-weight:600">${phone(it.digits)}</span>
            <span style="display:flex;align-items:center;gap:10px">
              <span class=${'tag t-' + it.rarity}>${RD[it.rarity].name}</span>
              <span class="val tnum"><${Coin} s=${14}/><span>${fmt(it.value)}</span></span>
            </span>
          </div>
          <button class="ib" aria-label="Закрыть" onClick=${() => this.setState({ sheet: null })} style="width:44px;height:44px;margin:-6px -10px 0 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ECEDEF" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div style="height:1px;background:#23262D"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
          <span style="font-size:14px;color:#8A8F98">Старт аукциона</span>
          <div class="stepper">
            <button class="ib" aria-label="Меньше" style="width:44px;height:44px;border-radius:12px" onClick=${() => this.bump(-1)}><${Minus}/></button>
            <span class="tnum" style="min-width:84px;text-align:center;font-size:16px;font-weight:600;white-space:nowrap">${fmt(this.state.listPrice)}</span>
            <button class="ib" aria-label="Больше" style="width:44px;height:44px;border-radius:12px" onClick=${() => this.bump(1)}><${Plus}/></button>
          </div>
        </div>
        <div class="col" style="gap:10px">
          <button class="btn1" onClick=${() => this.listLot()}>На аукцион</button>
          <button class="btn2" onClick=${() => this.sell()}>
            <span>Продать сразу</span>
            <span class="val tnum" style="font-size:15px"><${Coin} s=${14}/><span>${fmt(r10(it.value * 0.7))}</span></span>
          </button>
        </div>
      </div>`;
  }

  render(_, s) {
    const tabs = [
      { id: 'spin', label: 'Крутить', icon: html`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M9 5v14M15 5v14"/></svg>` },
      { id: 'coll', label: 'Коллекция', icon: html`<${Sim} w=${22} h=${22} sw=${1.7}/>` },
      { id: 'auc', label: 'Аукцион', icon: html`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-45 12 10)"><rect x="7" y="3" width="10" height="6" rx="1.5"/><path d="M12 9v11"/></g><path d="M13 21h8"/></svg>` },
      { id: 'rate', label: 'Рейтинг', icon: html`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg>` }
    ];
    return html`<div class="app">
      <div class="hdr">
        <div class="disp logo">
          <svg width="20" height="22" viewBox="0 0 20 22" fill="none" stroke="#ECEDEF" stroke-width="1.8" stroke-linejoin="round"><path d="M2 2h11l5 5v13H2z"/><rect x="6" y="10" width="8" height="6" rx="1"/></svg>
          <span>SIMRUSH</span>
        </div>
        <div class="bal">
          <${Coin}/>
          <span class="bal-v tnum">${fmt(s.balance)}</span>
          <button class="ib" aria-label="Пополнить" onClick=${() => { this.setState({ balance: this.state.balance + 5000 }); this.toast('+5 000', '#5BC98A'); }}><${Plus}/></button>
        </div>
      </div>

      ${s.toast && html`<div class="toast" key=${'t' + s.toast.id}>
        <span class="dot" style=${`width:8px;height:8px;background:${s.toast.color}`}></span>
        <span class="ell" style="min-width:0">${s.toast.text}</span>
      </div>`}

      <div class="scr" ref=${el => (this.scr = el)}>
        ${s.tab === 'spin' && this.spinScreen()}
        ${s.tab === 'coll' && this.collScreen()}
        ${s.tab === 'auc' && this.aucScreen()}
        ${s.tab === 'rate' && this.rateScreen()}
      </div>

      <nav class="nav">
        ${tabs.map(t => html`<button class=${'nb' + (s.tab === t.id ? ' on' : '')} onClick=${() => this.go(t.id)}>${t.icon}<span>${t.label}</span></button>`)}
      </nav>

      ${this.sheet()}
    </div>`;
  }
}

render(html`<${App}/>`, document.getElementById('root'));
</script>
</body>
</html>
